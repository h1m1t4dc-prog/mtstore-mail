<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mtstore.mail - Temporary Mail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #F0F7FF 0%, #E0F2FE 100%); color: #1E293B; }
    .cute-card { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(16px); border: 1.5px solid rgba(186, 230, 253, 0.8); box-shadow: 0 12px 35px -6px rgba(56, 189, 248, 0.15); }
    .btn-cute-primary { background: linear-gradient(135deg, #38BDF8 0%, #0284C7 100%); box-shadow: 0 6px 16px -3px rgba(2, 132, 199, 0.35); }
    .sub-box { background: #F8FAFC; border: 1px solid #E2E8F0; }
    .domain-pill { transition: all 0.2s ease; }
    .domain-pill.active { background: #0284C7; color: white; border-color: #0284C7; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-center pb-12">
  <div class="w-full max-w-md space-y-4">
    
    <!-- Header -->
    <div class="flex items-center justify-between px-2">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-2xl btn-cute-primary flex items-center justify-center text-white text-base shadow-md">🩵</div>
        <div>
          <span class="font-extrabold text-base text-slate-800 tracking-tight block leading-none">mtstore.mail</span>
          <span class="text-[10px] text-sky-600 font-bold">✨ 3 Domain Aktif</span>
        </div>
      </div>
      <div class="flex items-center gap-1.5 bg-white/90 border border-sky-100 px-3 py-1 rounded-full shadow-sm">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-[10px] font-extrabold text-emerald-600">LIVE</span>
      </div>
    </div>

    <!-- Main Control Card -->
    <div class="cute-card rounded-[32px] p-5 space-y-4">
      
      <!-- Top Section Inside Card -->
      <div class="flex items-center justify-between px-1">
        <span class="text-[11px] font-extrabold text-sky-600 uppercase tracking-wider flex items-center gap-1">
          <span>💌</span> Alamat Inbox
        </span>
        <span class="text-[11px] font-bold text-slate-400 cursor-pointer hover:text-sky-600 transition" onclick="toggleDomainSelect()">Atur Domain ⚙️</span>
      </div>

      <!-- Input Custom Username & Domain Dropdown -->
      <div class="space-y-2">
        <div class="flex items-center gap-2 bg-sky-50/80 border border-sky-200/90 rounded-2xl p-2 shadow-inner">
          <input type="text" id="userInput" value="mtstore" class="w-1/2 bg-transparent text-sm font-bold text-slate-700 outline-none px-2">
          <span class="text-sky-400 font-bold">@</span>
          <select id="domainSelect" class="w-1/2 bg-white border border-sky-200 rounded-xl text-xs font-bold text-sky-700 p-2.5 outline-none shadow-sm cursor-pointer">
            <option value="mtstorea.my.id">mtstorea.my.id</option>
            <option value="mtstoreku.web.id">mtstoreku.web.id</option>
            <option value="preminmit.my.id">preminmit.my.id</option>
          </select>
        </div>

        <!-- Quick Domain Pills (D1, D2, D3) -->
        <div class="flex items-center justify-between px-1 pt-0.5">
          <span class="text-[10px] text-slate-400 font-medium">Aktif: <span id="activeEmail" class="font-bold text-sky-600">mtstore@mtstorea.my.id</span></span>
          <div class="flex gap-1.5">
            <button onclick="setDomainByIndex(0)" id="pill0" class="domain-pill active text-[10px] font-extrabold px-2.5 py-0.5 rounded-lg border border-sky-200 bg-white text-sky-700">D1</button>
            <button onclick="setDomainByIndex(1)" id="pill1" class="domain-pill text-[10px] font-extrabold px-2.5 py-0.5 rounded-lg border border-sky-200 bg-white text-sky-700">D2</button>
            <button onclick="setDomainByIndex(2)" id="pill2" class="domain-pill text-[10px] font-extrabold px-2.5 py-0.5 rounded-lg border border-sky-200 bg-white text-sky-700">D3</button>
          </div>
        </div>
      </div>

      <!-- Info Status & Jumlah Pesan -->
      <div class="grid grid-cols-2 gap-3">
        <div class="sub-box rounded-2xl p-3 shadow-sm">
          <span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block">Masa Aktif</span>
          <div class="text-xs font-extrabold text-slate-700 mt-0.5 flex items-center gap-1">Permanen <span class="text-sky-500">💙</span></div>
        </div>
        <div class="sub-box rounded-2xl p-3 shadow-sm">
          <span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block">Kotak Masuk</span>
          <div class="text-xs font-extrabold text-slate-700 mt-0.5"><span id="msgCount" class="text-sky-600 font-extrabold">0</span> pesan</div>
        </div>
      </div>

      <!-- Action Buttons Grid (Super Complete) -->
      <div class="grid grid-cols-2 gap-2.5">
        <button onclick="copyEmail()" class="btn-cute-primary text-white text-xs font-bold py-3 rounded-2xl hover:opacity-95 transition flex items-center justify-center gap-1.5">
          📋 Salin Email
        </button>
        <button onclick="generateRandom()" class="sub-box hover:bg-sky-50 text-sky-700 text-xs font-bold py-3 rounded-2xl transition shadow-sm border border-sky-200">
          ✨ Buat Baru
        </button>
        <button onclick="alert('Fitur QR Code')" class="sub-box hover:bg-slate-100 text-slate-600 text-xs font-semibold py-2.5 rounded-xl transition flex items-center justify-center gap-1">
          📱 Kode QR
        </button>
        <button onclick="refreshInbox()" class="sub-box hover:bg-slate-100 text-slate-600 text-xs font-semibold py-2.5 rounded-xl transition flex items-center justify-center gap-1">
          🔄 Refresh
        </button>
        <button onclick="alert('Email dikunci dengan PIN')" class="sub-box hover:bg-slate-100 text-slate-600 text-xs font-semibold py-2.5 rounded-xl transition flex items-center justify-center gap-1">
          🔒 Kunci PIN
        </button>
        <button onclick="clearInbox()" class="bg-rose-50/70 hover:bg-rose-100 text-rose-600 border border-rose-200 text-xs font-semibold py-2.5 rounded-xl transition flex items-center justify-center gap-1 shadow-sm">
          🗑️ Hapus
        </button>
      </div>
    </div>

    <!-- Auto Refresh Bar -->
    <div class="cute-card rounded-2xl p-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <input type="checkbox" id="autoRefreshToggle" checked class="w-4 h-4 accent-sky-500 rounded cursor-pointer">
        <label for="autoRefreshToggle" class="text-xs font-bold text-slate-700 cursor-pointer">Auto Refresh <span class="text-sky-500 font-normal">5s</span></label>
      </div>
      <span class="text-[10px] bg-sky-50 text-sky-600 font-extrabold px-2.5 py-1 rounded-full border border-sky-100">Realtime Ready ✨</span>
    </div>

    <!-- Empty Inbox Section -->
    <div class="space-y-2">
      <div class="flex items-center justify-between px-2">
        <span class="text-xs font-extrabold text-slate-400 uppercase tracking-wider">Pesan Masuk</span>
        <span class="text-xs font-extrabold text-sky-600 bg-sky-50 px-2.5 py-0.5 rounded-full border border-sky-100">0</span>
      </div>

      <div class="cute-card rounded-[32px] p-8 text-center space-y-3">
        <div class="w-14 h-14 bg-sky-50 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner border border-sky-100">📭</div>
        <div class="space-y-1">
          <p class="text-xs font-bold text-slate-700">Belum ada pesan masuk</p>
          <p class="text-[11px] text-slate-400">Pesan atau kode OTP baru akan muncul otomatis secara real-time di sini.</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    const domains = ['mtstorea.my.id', 'mtstoreku.web.id', 'preminmit.my.id'];
    const userInput = document.getElementById('userInput');
    const domainSelect = document.getElementById('domainSelect');
    const activeEmail = document.getElementById('activeEmail');

    function updateEmailDisplay() {
      const fullEmail = `${userInput.value || 'mymail'}@${domainSelect.value}`;
      activeEmail.textContent = fullEmail;
    }

    userInput.addEventListener('input', updateEmailDisplay);
    domainSelect.addEventListener('change', (e) => {
      updateEmailDisplay();
      updatePillsActiveState();
    });

    function setDomainByIndex(index) {
      domainSelect.selectedIndex = index;
      updateEmailDisplay();
      updatePillsActiveState();
    }

    function updatePillsActiveState() {
      const selectedVal = domainSelect.value;
      domains.forEach((dom, idx) => {
        const pill = document.getElementById(`pill${idx}`);
        if (dom === selectedVal) {
          pill.classList.add('active');
        } else {
          pill.classList.remove('active');
        }
      });
    }

    function copyEmail() {
      navigator.clipboard.writeText(activeEmail.textContent);
      alert('Email berhasil disalin: ' + activeEmail.textContent);
    }

    function generateRandom() {
      const randomStr = Math.random().toString(36).substring(2, 9);
      userInput.value = randomStr;
      updateEmailDisplay();
    }

    function refreshInbox() {
      alert('Kotak masuk diperbarui. Belum ada pesan baru.');
    }

    function clearInbox() {
      alert('Kotak masuk dikosongkan.');
    }

    updateEmailDisplay();
    updatePillsActiveState();
  </script>
</body>
</html>
