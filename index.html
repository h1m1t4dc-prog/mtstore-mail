<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mtstore.mail - Temporary Email</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 20px;
            overflow: hidden;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .logo {
            font-weight: bold;
            font-size: 18px;
            color: #2563eb;
        }
        .status {
            font-size: 12px;
            background: #dcfce7;
            color: #15803d;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }
        .card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .label {
            font-size: 11px;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .email-display {
            font-size: 16px;
            font-weight: bold;
            color: #1e293b;
            word-break: break-all;
            margin-bottom: 10px;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:active {
            background: #1d4ed8;
        }
        button.secondary {
            background: #e2e8f0;
            color: #334155;
        }
        .inbox-header {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #1e293b;
            display: flex;
            justify-content: space-between;
        }
        .message-item {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            word-break: break-all;
            overflow-wrap: break-word;
        }
        .message-sender {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 4px;
        }
        .message-text {
            font-size: 13px;
            color: #0f172a;
            white-space: pre-wrap;
            line-height: 1.4;
        }
        .empty-inbox {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">mtstore.mail</div>
            <div class="status">● LIVE</div>
        </div>

        <div class="card">
            <div class="label">Alamat Inbox</div>
            <div class="email-display" id="emailAddress">Memuat...</div>
            <div class="btn-group">
                <button onclick="copyEmail()">Salin Email</button>
                <button class="secondary" onclick="generateNewEmail()">Buat Baru</button>
            </div>
        </div>

        <div class="card">
            <div class="btn-group" style="margin-top:0;">
                <button class="secondary" onclick="fetchMessages()">Refresh Manual</button>
                <button class="secondary" onclick="clearInbox()">Bersihkan Inbox</button>
            </div>
        </div>

        <div class="inbox-header">
            <span>Pesan Masuk</span>
            <span id="msgCount">0 pesan</span>
        </div>

        <div id="inboxList">
            <div class="empty-inbox">Belum ada pesan masuk...</div>
        </div>
    </div>

    <script>
        // --- SESUAIKAN LINK WORKER KAMU DI SINI ---
        const WORKER_URL = "https://tmail-ku.h1m1t4dc.workers.dev"; 
        const DOMAIN = "preminmit.my.id";

        let currentEmail = localStorage.getItem("tmail_current");

        function generateNewEmail() {
            const randomId = "user" + Math.floor(1000 + Math.random() * 9000);
            currentEmail = `${randomId}@${DOMAIN}`;
            localStorage.setItem("tmail_current", currentEmail);
            document.getElementById("emailAddress").innerText = currentEmail;
            clearInboxDataUI();
        }

        if (!currentEmail) {
            generateNewEmail();
        } else {
            document.getElementById("emailAddress").innerText = currentEmail;
        }

        function copyEmail() {
            navigator.clipboard.writeText(currentEmail);
            alert("Email berhasil disalin!");
        }

        function clearInboxDataUI() {
            document.getElementById("inboxList").innerHTML = '<div class="empty-inbox">Belum ada pesan masuk...</div>';
            document.getElementById("msgCount").innerText = "0 pesan";
        }

        async function fetchMessages() {
            if (!currentEmail) return;
            try {
                const res = await fetch(`${WORKER_URL}/api/get?email=${encodeURIComponent(currentEmail)}`);
                const data = await res.json();
                
                const listEl = document.getElementById("inboxList");
                const countEl = document.getElementById("msgCount");

                if (data.messages && data.messages.length > 0) {
                    countEl.innerText = `${data.messages.length} pesan`;
                    listEl.innerHTML = "";
                    data.messages.forEach(msg => {
                        const item = document.createElement("div");
                        item.className = "message-item";
                        item.innerHTML = `
                            <div class="message-sender">Dari: <b>${msg.from}</b></div>
                            <div style="font-weight:bold; font-size:13px; margin-bottom:4px; color:#1d4ed8;">${msg.subject}</div>
                            <div class="message-text">${msg.text}</div>
                        `;
                        listEl.appendChild(item);
                    });
                } else {
                    clearInboxDataUI();
                }
            } catch (e) {
                console.error("Gagal memuat pesan", e);
            }
        }

        async function clearInbox() {
            if (!confirm("Hapus semua pesan di inbox ini?")) return;
            try {
                await fetch(`${WORKER_URL}/api/clear?email=${encodeURIComponent(currentEmail)}`);
                clearInboxDataUI();
            } catch (e) {
                alert("Gagal membersihkan inbox.");
            }
        }

        // Auto-refresh tiap 3 detik
        setInterval(fetchMessages, 3000);
        fetchMessages();
    </script>
</body>
</html>
