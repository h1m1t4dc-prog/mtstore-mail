<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mtstore.mail - Temporary Mail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #FAF5FF; color: #1E293B; }
    .cute-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid #F3E8FF; box-shadow: 0 10px 30px -5px rgba(236, 72, 153, 0.06); }
    .btn-cute { background: linear-gradient(135deg, #EC4899 0%, #8B5CF6 100%); }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-center">
  <div class="w-full max-w-md space-y-4">
    
    <!-- Header -->
    <div class="flex items-center justify-between px-2">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-2xl btn-cute flex items-center justify-center text-white font-bold text-sm shadow-sm">💌</div>
        <span class="font-bold text-base text-slate-800">mtstore.mail</span>
        <span class="text-[10px] bg-purple-50 text-purple-600 px-2.5 py-0.5 rounded-full font-semibold border border-purple-100">3 Domain</span>
      </div>
      <span class="text-xs bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-full font-semibold flex items-center gap-1.5 border border-emerald-100">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> LIVE
      </span>
    </div>

    <!-- Main Control Card -->
    <div class="cute-card rounded-[28px] p-5 space-y-4">
      
      <!-- Input Custom Username & Domain Dropdown -->
      <div class="space-y-1.5">
        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Alamat Inbox</label>
        <div class="flex items-center gap-2 bg-purple-50/50 border border-purple-100 rounded-2xl p-2">
          <input type="text" id="userInput" value="mtstore" class="w-1/2 bg-transparent text-sm font-semibold text-slate-700 outline-none px-2">
          <span class="text-slate-400">@</span>
          <select id="domainSelect" class="w-1/2 bg-white border border-purple-100 rounded-xl text-xs font-semibold text-slate-600 p-2 outline-none shadow-sm">
            <option value="mtstorea.my.id">mtstorea.my.id</option>
            <option value="mtstoreku.web.id">mtstoreku.web.id</option>
            <option value="preminmit.my.id">preminmit.my.id</option>
          </select>
        </div>
        <div class="text-[11px] text-slate-400 px-1">Aktif: <span id="activeEmail" class="font-medium text-slate-600">mtstore@mtstorea.my.id</span></div>
      </div>

      <!-- Info Status & Jumlah Pesan -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-purple-50/30 border border-purple-100/60 rounded-2xl p-3">
          <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Masa Aktif</span>
          <div class="text-xs font-bold text-slate-700 mt-0.5 flex items-center gap-1">Permanen <span class="text-pink-500">✨</span></div>
        </div>
        <div class="bg-purple-50/30 border border-purple-100/60 rounded-2xl p-3">
          <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Kotak Masuk</span>
          <div class="text-xs font-bold text-slate-700 mt-0.5"><span id="msgCount">0</span> pesan</div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="grid grid-cols-2 gap-2">
        <button onclick="copyEmail()" class="btn-cute text-white text-xs font-semibold py-3 rounded-2xl shadow-md hover:opacity-95 transition flex items-center justify-center gap-1.5">
          📋 Salin Email
        </button>
        <button onclick="generateRandom()" class="bg-purple-50 hover:bg-purple-100 text-purple-700 text-xs font-semibold py-3 rounded-2xl transition border border-purple-100">
          ✨ Buat Baru
        </button>
        <button onclick="alert('QR Code ditampilkan')" class="bg-slate-50 border border-slate-200 hover:bg-slate-100 text-slate-600 text-xs font-medium py-2.5 rounded-xl transition">
          📱 Kode QR
        </button>
        <button onclick="refreshInbox()" class="bg-slate-50 border border-slate-200 hover:bg-slate-100 text-slate-600 text-xs font-medium py-2.5 rounded-xl transition">
          🔄 Refresh
        </button>
      </div>
    </div>

    <!-- Empty Inbox Section -->
    <div class="space-y-2">
      <div class="flex items-center justify-between px-2">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Pesan Masuk</span>
        <span class="text-xs font-bold text-slate-400">0</span>
      </div>

      <div class="cute-card rounded-[28px] p-8 text-center space-y-2 border border-purple-100">
        <div class="text-2xl">📭</div>
        <p class="text-xs font-semibold text-slate-600">Belum ada pesan masuk</p>
        <p class="text-[11px] text-slate-400">Pesan atau kode OTP baru akan muncul otomatis di sini.</p>
      </div>
    </div>

  </div>

  <script>
    const userInput = document.getElementById('userInput');
    const domainSelect = document.getElementById('domainSelect');
    const activeEmail = document.getElementById('activeEmail');

    function updateEmailDisplay() {
      const fullEmail = `${userInput.value || 'mymail'}@${domainSelect.value}`;
      activeEmail.textContent = fullEmail;
    }

    userInput.addEventListener('input', updateEmailDisplay);
    domainSelect.addEventListener('change', updateEmailDisplay);

    function copyEmail() {
      navigator.clipboard.writeText(activeEmail.textContent);
      alert('Email berhasil disalin: ' + activeEmail.textContent);
    }

    function generateRandom() {
      const randomStr = Math.random().toString(36).substring(2, 9);
      userInput.value = randomStr;
      updateEmailDisplay();
    }

    function refreshInbox() {
      alert('Kotak masuk diperbarui. Belum ada pesan baru.');
    }

    updateEmailDisplay();
  </script>
</body>
</html>
