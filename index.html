<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mtstore.mail - Temporary Mail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F8FAFC; color: #1E293B; }
    .glass-box { background: #FFFFFF; border: 1px solid #E2E8F0; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="glass-box rounded-2xl p-6 w-full max-w-md space-y-5">
    <div class="flex items-center justify-between">
      <h1 class="font-bold text-lg text-blue-600">mtstore.mail</h1>
      <span class="text-xs bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-full font-medium">● Online</span>
    </div>

    <div class="space-y-2">
      <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Alamat Email Temporary Anda</label>
      <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl p-3">
        <input type="text" id="emailBox" readonly value="loading@mtstorea.my.id" class="w-full bg-transparent text-sm font-medium text-slate-700 outline-none">
        <button onclick="copyEmail()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">Salin</button>
      </div>
    </div>

    <div class="border-t border-slate-100 pt-4">
      <div class="flex items-center justify-between mb-3">
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Kotak Masuk (Inbox)</span>
        <button onclick="refreshInbox()" class="text-xs text-blue-600 hover:underline font-medium">Segarkan</button>
      </div>
      <div class="bg-slate-50 border border-dashed border-slate-200 rounded-xl p-6 text-center text-xs text-slate-400">
        Belum ada pesan masuk. Menunggu OTP...
      </div>
    </div>
  </div>

  <script>
    const domains = ['mtstorea.my.id', 'mtstoreku.web.id', 'preminmit.my.id'];
    function generateEmail() {
      const randomString = Math.random().toString(36).substring(2, 9);
      const randomDomain = domains[Math.floor(Math.random() * domains.length)];
      document.getElementById('emailBox').value = `${randomString}@${randomDomain}`;
    }
    function copyEmail() {
      const emailBox = document.getElementById('emailBox');
      emailBox.select();
      navigator.clipboard.writeText(emailBox.value);
      alert('Email berhasil disalin!');
    }
    function refreshInbox() {
      alert('Memeriksa pesan baru...');
    }
    generateEmail();
  </script>
</body>
</html>
