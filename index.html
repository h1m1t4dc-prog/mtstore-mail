<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mtstore.mail - Temporary Mail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #F0F7FF 0%, #E0F2FE 100%); color: #1E293B; }
    .cute-card { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(16px); border: 1.5px solid rgba(186, 230, 253, 0.8); box-shadow: 0 12px 35px -6px rgba(56, 189, 248, 0.15); }
    .btn-cute-primary { background: linear-gradient(135deg, #38BDF8 0%, #0284C7 100%); box-shadow: 0 6px 16px -3px rgba(2, 132, 199, 0.35); }
    .sub-box { background: #F8FAFC; border: 1px solid #E2E8F0; }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-center pb-12">
  <div class="w-full max-w-md space-y-4">
    
    <!-- Header -->
    <div class="flex items-center justify-between px-2">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-2xl btn-cute-primary flex items-center justify-center text-white text-base shadow-md">🩵</div>
        <div>
          <span class="font-extrabold text-base text-slate-800 tracking-tight block leading-none">mtstore.mail</span>
          <span class="text-[10px] text-sky-600 font-bold">✨ 3 Domain Aktif</span>
        </div>
      </div>
      <div class="flex items-center gap-1.5 bg-white/90 border border-sky-100 px-3 py-1 rounded-full shadow-sm">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-[10px] font-extrabold text-emerald-600">LIVE</span>
      </div>
    </div>

    <!-- Main Control Card -->
    <div class="cute-card rounded-[32px] p-5 space-y-4">
      
      <div class="flex items-center justify-between px-1">
        <span class="text-[11px] font-extrabold text-sky-600 uppercase tracking-wider flex items-center gap-1">
          <span>💌</span> Alamat Inbox
        </span>
        <span class="text-[11px] font-bold text-slate-400">Pilih Domain ⚙️</span>
      </div>

      <!-- Input Custom Username & Domain Dropdown -->
      <div class="space-y-2">
        <div class="flex items-center gap-2 bg-sky-50/80 border border-sky-200/90 rounded-2xl p-2 shadow-inner">
          <input type="text" id="userInput" value="29nyoxa" class="w-1/2 bg-transparent text-sm font-bold text-slate-700 outline-none px-2" oninput="updateEmailDisplay()">
          <span class="text-sky-400 font-bold">@</span>
          <select id="domainSelect" class="w-1/2 bg-white border border-sky-200 rounded-xl text-xs font-bold text-sky-700 p-2.5 outline-none shadow-sm cursor-pointer" onchange="updateEmailDisplay()">
            <option value="mtstorea.my.id">mtstorea.my.id</option>
            <option value="mtstoreku.web.id">mtstoreku.web.id</option>
            <option value="preminmit.my.id">preminmit.my.id</option>
          </select>
        </div>

        <div class="px-1 pt-0.5">
          <span class="text-[10px] text-slate-400 font-medium">Aktif: <span id="activeEmail" class="font-bold text-sky-600">29nyoxa@mtstorea.my.id</span></span>
        </div>
      </div>

      <!-- Info Status & Jumlah Pesan -->
      <div class="grid grid-cols-2 gap-3">
        <div class="sub-box rounded-2xl p-3 shadow-sm">
          <span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block">Masa Aktif</span>
          <div class="text-xs font-extrabold text-slate-700 mt-0.5 flex items-center gap-1">Permanen <span class="text-sky-500">💙</span></div>
        </div>
        <div class="sub-box rounded-2xl p-3 shadow-sm">
          <span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block">Kotak Masuk</span>
          <div class="text-xs font-extrabold text-slate-700 mt-0.5"><span id="msgCount" class="text-sky-600 font-extrabold">0</span> pesan</div>
        </div>
      </div>

      <!-- Action Buttons Grid (Clean & Active QR) -->
      <div class="grid grid-cols-2 gap-2.5">
        <button onclick="copyEmail()" class="btn-cute-primary text-white text-xs font-bold py-3 rounded-2xl hover:opacity-95 transition flex items-center justify-center gap-1.5 shadow-md">
          📋 Salin Email
        </button>
        <button onclick="generateRandom()" class="sub-box hover:bg-sky-50 text-sky-700 text-xs font-bold py-3 rounded-2xl transition shadow-sm border border-sky-200">
          ✨ Buat Baru
        </button>
        <button onclick="showQRCode()" class="sub-box hover:bg-slate-100 text-slate-600 text-xs font-semibold py-2.5 rounded-xl transition flex items-center justify-center gap-1">
          📱 Kode QR
        </button>
        <button onclick="fetchInbox()" class="sub-box hover:bg-slate-100 text-slate-600 text-xs font-semibold py-2.5 rounded-xl transition flex items-center justify-center gap-1">
          🔄 Refresh
        </button>
      </div>
    </div>

    <!-- Auto Refresh Bar -->
    <div class="cute-card rounded-2xl p-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <input type="checkbox" id="autoRefreshToggle" checked class="w-4 h-4 accent-sky-500 rounded cursor-pointer">
        <label for="autoRefreshToggle" class="text-xs font-bold text-slate-700 cursor-pointer">Auto Refresh <span class="text-sky-500 font-normal">5s</span></label>
      </div>
      <span class="text-[10px] bg-sky-50 text-sky-600 font-extrabold px-2.5 py-1 rounded-full border border-sky-100">Realtime Ready ✨</span>
    </div>

    <!-- Inbox List Section -->
    <div class="space-y-2">
      <div class="flex items-center justify-between px-2">
        <span class="text-xs font-extrabold text-slate-400 uppercase tracking-wider">Pesan Masuk</span>
        <span id="badgeCount" class="text-xs font-extrabold text-sky-600 bg-sky-50 px-2.5 py-0.5 rounded-full border border-sky-100">0</span>
      </div>

      <div id="inboxContainer" class="space-y-3">
        <!-- Default Empty State -->
        <div class="cute-card rounded-[32px] p-8 text-center space-y-3" id="emptyState">
          <div class="w-14 h-14 bg-sky-50 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner border border-sky-100">📭</div>
          <div class="space-y-1">
            <p class="text-xs font-bold text-slate-700">Belum ada pesan masuk</p>
            <p class="text-[11px] text-slate-400">Pesan atau kode OTP baru akan muncul otomatis secara real-time di sini.</p>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- QR Modal (Hidden by default) -->
  <div id="qrModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="cute-card bg-white rounded-3xl p-6 max-w-xs w-full text-center space-y-4 shadow-2xl">
      <h3 class="font-extrabold text-sm text-slate-800">QR Code Alamat Email</h3>
      <div id="qrcode" class="bg-white p-3 rounded-2xl inline-block border border-sky-100 shadow-inner">
        <img id="qrImg" src="" alt="QR Code" class="w-48 h-48 mx-auto rounded-lg">
      </div>
      <p id="qrEmailText" class="text-xs font-bold text-sky-600 break-all"></p>
      <button onclick="closeQRCode()" class="w-full btn-cute-primary text-white text-xs font-bold py-2.5 rounded-xl">Tutup</button>
    </div>
  </div>

  <script>
    const userInput = document.getElementById('userInput');
    const domainSelect = document.getElementById('domainSelect');
    const activeEmail = document.getElementById('activeEmail');
    const msgCount = document.getElementById('msgCount');
    const badgeCount = document.getElementById('badgeCount');
    const inboxContainer = document.getElementById('inboxContainer');
    const emptyState = document.getElementById('emptyState');

    function getActiveEmail() {
      return `${(userInput.value || 'mymail').trim().toLowerCase()}@${domainSelect.value}`;
    }

    function updateEmailDisplay() {
      activeEmail.textContent = getActiveEmail();
      fetchInbox();
    }

    function copyEmail() {
      const email = getActiveEmail();
      navigator.clipboard.writeText(email);
      alert('Email berhasil disalin: ' + email);
    }

    function generateRandom() {
      const randomStr = Math.random().toString(36).substring(2, 9);
      userInput.value = randomStr;
      updateEmailDisplay();
    }

    function showQRCode() {
      const email = getActiveEmail();
      document.getElementById('qrEmailText').textContent = email;
      document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(email)}`;
      document.getElementById('qrModal').classList.remove('hidden');
      document.getElementById('qrModal').classList.add('flex');
    }

    function closeQRCode() {
      document.getElementById('qrModal').classList.remove('flex');
      document.getElementById('qrModal').classList.add('hidden');
    }

    // Fungsi untuk menarik data email dari KV Cloudflare secara otomatis
    async function fetchInbox() {
      const email = getActiveEmail();
      const username = email.split('@')[0];

      try {
        // Mengambil data dari Worker KV (pastikan domain Worker kamu sudah mengarah ke endpoint reader KV atau worker reader khusus)
        // Catatan: Ganti URL di bawah dengan endpoint Worker baca KV kamu jika dipisah, atau gunakan Worker handler yang sama.
        // Untuk saat ini kita fetch langsung dari KV binding via API worker reader atau Worker get.
        const response = await fetch(`https://odd-shape-7a2a.h1m1t4dc.workers.dev/api/get?email=${encodeURIComponent(email)}`);
        if (!response.ok) return;
        
        const data = await response.json();
        renderMessages(data);
      } catch (e) {
        // Fallback senyap jika fetch kosong/belum ada endpoint reader khusus
      }
    }

    function renderMessages(messages) {
      if (!messages || messages.length === 0) {
        msgCount.textContent = '0';
        badgeCount.textContent = '0';
        if (!document.getElementById('emptyState')) {
          inboxContainer.innerHTML = `
            <div class="cute-card rounded-[32px] p-8 text-center space-y-3" id="emptyState">
              <div class="w-14 h-14 bg-sky-50 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner border border-sky-100">📭</div>
              <div class="space-y-1">
                <p class="text-xs font-bold text-slate-700">Belum ada pesan masuk</p>
                <p class="text-[11px] text-slate-400">Pesan atau kode OTP baru akan muncul otomatis secara real-time di sini.</p>
              </div>
            </div>`;
        }
        return;
      }

      msgCount.textContent = messages.length;
      badgeCount.textContent = messages.length;

      let html = '';
      messages.forEach(msg => {
        html += `
          <div class="cute-card rounded-2xl p-4 space-y-2 shadow-sm border border-sky-100">
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-extrabold text-sky-600 bg-sky-50 px-2 py-0.5 rounded-md truncate max-w-[180px]">Dari: ${msg.from}</span>
              <span class="text-[10px] text-slate-400 font-medium">${msg.date}</span>
            </div>
            <h4 class="text-xs font-extrabold text-slate-800">${msg.subject}</h4>
            <p class="text-[11px] text-slate-600 bg-sky-50/50 p-2.5 rounded-xl border border-sky-100/60 whitespace-pre-line leading-relaxed">${msg.body}</p>
          </div>
        `;
      });
      inboxContainer.innerHTML = html;
    }

    // Auto Refresh Loop tiap 5 detik jika toggle aktif
    setInterval(() => {
      const toggle = document.getElementById('autoRefreshToggle');
      if (toggle && toggle.checked) {
        fetchInbox();
      }
    }, 5000);

    updateEmailDisplay();
  </script>
</body>
</html>
