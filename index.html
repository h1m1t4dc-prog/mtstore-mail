<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudTmail - Temp Mail</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-50 min-h-screen text-slate-800 p-4 md:p-8 font-sans">

  <div class="max-w-3xl mx-auto space-y-5">
    <!-- Header -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-sky-100 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold text-sky-600">CloudTmail</h1>
        <p class="text-xs text-slate-500">Temporary Email Instan & Gratis</p>
      </div>
      <div class="text-xs bg-sky-50 text-sky-700 border border-sky-200 px-3 py-1.5 rounded-full font-semibold">
        Auto-Refresh: <span id="timer">5</span>s
      </div>
    </div>

    <!-- Kotak Pengaturan Email -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-sky-100 space-y-4">
      <div class="flex rounded-xl border border-sky-200 overflow-hidden bg-sky-50/40">
        <input id="user" type="text" placeholder="ketik.nama" oninput="updateEmail()" class="w-full px-4 py-3 bg-transparent font-semibold text-sm focus:outline-none" />
        <span class="flex items-center px-1 text-sky-500 font-bold">@</span>
        <select id="domain" onchange="updateEmail()" class="bg-sky-100 text-sky-900 font-semibold text-sm px-3 py-3 focus:outline-none">
          <option value="preminmit.my.id">preminmit.my.id</option>
          <option value="mtstoreku.web.id">mtstoreku.web.id</option>
          <option value="mtstorea.my.id">mtstorea.my.id</option>
        </select>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-sm font-semibold">
        <button onclick="copyMail()" id="btnCopy" class="bg-sky-500 hover:bg-sky-600 text-white py-2.5 rounded-xl transition">Salin Email</button>
        <button onclick="randomMail()" class="bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 py-2.5 rounded-xl transition">Buat Random</button>
        <button onclick="toggleQR()" class="bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 py-2.5 rounded-xl transition">Kode QR</button>
        <button onclick="loadInbox()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl transition">Refresh</button>
      </div>

      <!-- Area QR Code -->
      <div id="qrBox" class="hidden text-center pt-3 border-t border-sky-100">
        <img id="qrImg" class="w-36 h-36 mx-auto border p-2 rounded-xl bg-white" />
      </div>
    </div>

    <!-- Kotak Masuk -->
    <div class="bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden">
      <div class="p-4 bg-sky-50/50 border-b border-sky-100 flex justify-between items-center">
        <span class="font-bold text-sm">Kotak Masuk (<span id="count">0</span>)</span>
        <button onclick="clearInbox()" class="text-xs text-rose-500 font-semibold hover:underline">Hapus Semua</button>
      </div>
      <div id="inbox" class="divide-y divide-slate-100 max-h-96 overflow-y-auto p-4 text-sm text-slate-500 text-center">
        Belum ada email masuk...
      </div>
    </div>
  </div>

  <script>
    // SUDAH DISESUAIKAN DENGAN LINK WORKER KAMU:
    const API_URL = "https://tmail-ku.h1m1t4dc.workers.dev";

    let currentEmail = "";
    let sec = 5;

    function randomMail() {
      const names = ["sky", "blue", "fast", "nova", "pixel", "cyber"];
      document.getElementById("user").value = names[Math.floor(Math.random() * names.length)] + Math.floor(100 + Math.random() * 900);
      updateEmail();
    }

    function updateEmail() {
      const u = document.getElementById("user").value.trim().toLowerCase() || "user";
      const d = document.getElementById("domain").value;
      currentEmail = `${u}@${d}`;
      document.getElementById("qrImg").src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(currentEmail)}`;
      loadInbox();
    }

    function copyMail() {
      navigator.clipboard.writeText(currentEmail);
      const btn = document.getElementById("btnCopy");
      btn.textContent = "✓ Tersalin!";
      setTimeout(() => (btn.textContent = "Salin Email"), 1500);
    }

    function toggleQR() {
      document.getElementById("qrBox").classList.toggle("hidden");
    }

    async function loadInbox() {
      try {
        const res = await fetch(`${API_URL}/api/get?email=${encodeURIComponent(currentEmail)}`);
        const data = await res.json();
        const list = data.messages || [];
        document.getElementById("count").textContent = list.length;

        const box = document.getElementById("inbox");
        if (!list.length) {
          box.innerHTML = `<p class="py-8 text-slate-400">Belum ada email masuk ke <b>${currentEmail}</b></p>`;
          return;
        }

        box.innerHTML = list.map(m => `
          <div class="py-3 text-left space-y-1">
            <div class="flex justify-between text-xs text-sky-600 font-bold">
              <span>Dari: ${m.from}</span>
              <span class="text-slate-400">${new Date(m.timestamp).toLocaleTimeString("id-ID")}</span>
            </div>
            <div class="font-bold text-slate-800">${m.subject}</div>
            <div class="text-xs text-slate-600 bg-sky-50/60 p-3 rounded-lg border border-sky-100 whitespace-pre-wrap">${m.text}</div>
          </div>
        `).join("");
      } catch (e) {}
    }

    async function clearInbox() {
      await fetch(`${API_URL}/api/clear?email=${encodeURIComponent(currentEmail)}`, { method: "DELETE" });
      loadInbox();
    }

    randomMail();
    setInterval(() => {
      sec--;
      if (sec <= 0) { loadInbox(); sec = 5; }
      document.getElementById("timer").textContent = sec;
    }, 1000);
  </script>
</body>
</html>
